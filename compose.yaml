name: access-control-platform

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: access_service
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_USER: access_service
    volumes:
      - access-service-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    stop_grace_period: 10s

  access-service-migrate:
    build:
      context: .
      target: migration
    image: access-control-platform/access-service-migration:development
    environment:
      DATABASE_URL: postgresql://access_service:local-development-only@postgres:5432/access_service
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  access-service:
    build:
      context: .
      target: development
    image: access-control-platform/access-service:development
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${ACCESS_SERVICE_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./services/access-service/src
        target: /app/services/access-service/src
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s

volumes:
  access-service-postgres-data:
